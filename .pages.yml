# Office Impact - Pages CMS configuration
#
# Website content is edited on the Develop branch.
#
# Content types:
#   event       = appears only in Events / Calendar
#   story       = appears only in Stories
#   event_story = appears in both
#
# Keep this file in the repository root as .pages.yml


# ============================================================
# MEDIA
# ============================================================

media:
  input: media
  output: media
  rename: safe
  categories: [image]
  extensions: [jpg, jpeg, png, webp]


# ============================================================
# GLOBAL SETTINGS
# ============================================================

settings:
  hide: true
  content:
    merge: true


# ============================================================
# CONTENT
# ============================================================

content:

  # ==========================================================
  # EVENTS & STORIES
  # ==========================================================

  - name: entries
    label: Events & Stories
    type: file
    path: content/entries.json
    format: json

    fields:

      - name: entries
        label: Content
        type: block
        list: true
        blockKey: kind

        blocks:

          # ==================================================
          # EVENT ONLY
          # ==================================================

          - name: event
            fields:

              - name: id
                label: Internal ID
                type: string
                required: true
                pattern: "^[a-z0-9-]+$"
                description: Use lowercase words separated by hyphens, for example community-breakfast-2027.

              - name: published
                label: Published
                type: boolean
                default: true
                description: Turn off to hide this item from the website.

              - name: title
                label: Event title
                type: string
                required: true

              - name: event_date
                label: Event date
                type: date
                required: true

              - name: event_time
                label: Event time
                type: string
                description: For example 09:00 - 12:00 or 11:00 CET.

              - name: event_type
                label: Event type
                type: select
                options:
                  values:
                    - Summit
                    - Webinar
                    - Community meetup
                    - Roundtable
                    - Workshop
                    - Online event
                    - Other

              - name: event_summary
                label: Short description
                type: text
                description: Short introduction to the event.

              - name: event_details
                label: Event details
                type: rich-text
                options:
                  format: html
                  media: false
                  switcher: false

              - name: event_location
                label: Venue / city
                type: string
                description: For example DB55, Amsterdam or Online.

              - name: address
                label: Physical address
                type: string
                description: Used for the map on upcoming physical events.

              - name: map_query
                label: Map location override
                type: string
                description: Optional. Use only if Google Maps does not resolve the address correctly.

              - name: venue_image
                label: Venue image
                type: image
                description: Optional image of the venue for an upcoming event.
                options:
                  path: events
                  categories: [image]
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe

              - name: event_image
                label: Event photo
                type: image
                description: Optional. Add a photo after the event has taken place.
                options:
                  path: events
                  categories: [image]
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe

              - name: event_image_alt
                label: Event photo description
                type: string
                description: Accessibility description for the event photo.

              - name: registration_url
                label: Registration / event URL
                type: string
                description: Use a full https:// link.


          # ==================================================
          # STORY ONLY
          # ==================================================

          - name: story
            fields:

              - name: id
                label: Internal ID
                type: string
                required: true
                pattern: "^[a-z0-9-]+$"
                description: Use lowercase words separated by hyphens.

              - name: published
                label: Published
                type: boolean
                default: true
                description: Turn off to hide this story from the website.

              - name: title
                label: Story title
                type: string
                required: true

              - name: publication_date
                label: Publication date
                type: date
                required: true

              - name: category
                label: Category
                type: select
                options:
                  values:
                    - Community
                    - Learning
                    - Perspective
                    - News
                    - Webinar
                    - Event recap

              - name: post_summary
                label: Short introduction
                type: text
                description: Short text shown on the story card.

              - name: post_body
                label: Story
                type: rich-text
                options:
                  format: html
                  media: false
                  switcher: false

              - name: post_image
                label: Story image
                type: image
                description: If blank, the venue image (upcoming event) or event photo (past event) is reused.
                options:
                  path: stories
                  categories: [image]
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe

              - name: post_image_alt
                label: Image description
                type: string
                description: Short accessibility description.

              - name: featured_post
                label: Featured story
                type: boolean
                default: false
                description: The newest featured story gets the large homepage card.

              - name: source
                label: Source
                type: string
                description: For example LinkedIn.

              - name: source_url
                label: Source / LinkedIn URL
                type: string
                description: Optional full https:// link.


          # ==================================================
          # EVENT + STORY
          # ==================================================

          - name: event_story
            fields:

              # ------------------------------------------------
              # GENERAL
              # ------------------------------------------------

              - name: id
                label: Internal ID
                type: string
                required: true
                pattern: "^[a-z0-9-]+$"
                description: Use lowercase words separated by hyphens.

              - name: published
                label: Published
                type: boolean
                default: true
                description: Turn off to hide this item from the website.

              - name: title
                label: Event title
                type: string
                required: true


              # ------------------------------------------------
              # EVENT
              # ------------------------------------------------

              - name: event_date
                label: Event date
                type: date
                required: true

              - name: event_time
                label: Event time
                type: string
                description: For example 09:00 - 17:00 or 11:00 CET.

              - name: event_type
                label: Event type
                type: select
                options:
                  values:
                    - Summit
                    - Webinar
                    - Community meetup
                    - Roundtable
                    - Workshop
                    - Online event
                    - Other

              - name: event_summary
                label: Event short description (optional)
                type: text
                description: Optional override. If blank, the story short introduction is reused.

              - name: event_details
                label: Event details (optional)
                type: rich-text
                description: Optional override. If blank, the story / recap is reused.
                options:
                  format: html
                  media: false
                  switcher: false

              - name: event_location
                label: Venue / city
                type: string
                description: For example DB55, Amsterdam or Online.

              - name: address
                label: Physical address
                type: string

              - name: map_query
                label: Map location override
                type: string
                description: Optional. Use only if Google Maps does not resolve the physical address correctly.

              - name: venue_image
                label: Venue image
                type: image
                description: Preferred image for an upcoming event. If blank, the story image or event photo is reused.
                options:
                  path: events
                  categories: [image]
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe

              - name: event_image
                label: Event photo
                type: image
                description: Preferred photo from the actual event. If blank, the story image or venue image is reused.
                options:
                  path: events
                  categories: [image]
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe

              - name: event_image_alt
                label: Event photo description
                type: string

              - name: registration_url
                label: Registration / event URL
                type: string
                description: Optional full https:// link.


              # ------------------------------------------------
              # STORY / RECAP
              # ------------------------------------------------

              - name: post_title
                label: Different story headline
                type: string
                description: Optional. Leave blank to use the event title.

              - name: publication_date
                label: Story publication date
                type: date
                description: Date shown in Stories.

              - name: category
                label: Story category
                type: select
                options:
                  values:
                    - Community
                    - Learning
                    - Perspective
                    - News
                    - Webinar
                    - Event recap

              - name: post_summary
                label: Story short introduction
                type: text
                description: Short text shown on the story card. If blank, the event short description is reused.

              - name: post_body
                label: Story / recap
                type: rich-text
                description: If blank, the event details are reused.
                options:
                  format: html
                  media: false
                  switcher: false

              - name: post_image
                label: Story image
                type: image
                description: If blank, the venue image (upcoming event) or event photo (past event) is reused.
                options:
                  path: stories
                  categories: [image]
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe

              - name: post_image_alt
                label: Story image description
                type: string

              - name: featured_post
                label: Featured story
                type: boolean
                default: false
                description: The newest featured story gets the large homepage card.

              - name: source
                label: Source
                type: string
                description: For example LinkedIn.

              - name: source_url
                label: Source / LinkedIn URL
                type: string
                description: Optional full https:// link.


  # ==========================================================
  # PEOPLE
  # ==========================================================

  - name: people
    label: Team
    type: file
    path: content/people.json
    format: json
    list: true

    fields:

      - name: name
        label: Name
        type: string
        required: true

      - name: role
        label: Role
        type: string

      - name: organization
        label: Organisation
        type: string

      - name: office_impact_role
        label: Role in Office Impact
        type: string
        description: Optional community role, for example Founder, Core team, Host, Ambassador or Contributor.

      - name: bio
        label: Short bio - homepage
        type: text
        description: A concise introduction for the People card on the main page.

      - name: bio_long
        label: Full bio - profile detail
        type: text
        description: Optional longer biography. If blank, the short bio is used.

      - name: linkedin_url
        label: LinkedIn URL
        type: string
        description: Use a full https:// URL.

      - name: image
        label: Profile image
        type: image
        options:
          path: people
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: featured
        label: Featured
        type: boolean

      - name: published
        label: Published
        type: boolean

    operations:
      create: true
      rename: false
      delete: true


# ============================================================
# ACTIONS
# ============================================================

actions:

  - name: publish-production
    label: Publish to production
    workflow: publish-production.yml
    ref: Develop
    cancelable: false

    confirm:
      title: Publish website?
      message: This will publish the current Develop content to officeimpact.co.
      button: Publish
