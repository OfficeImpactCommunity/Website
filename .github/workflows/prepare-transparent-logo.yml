name: Prepare transparent Office Impact logo

on:
  push:
    branches:
      - DevelopSupabase
    paths:
      - ".github/scripts/make_logo_transparent.py"
      - ".github/workflows/prepare-transparent-logo.yml"
      - "media/OLD_office-impact-logo.jpg"

permissions:
  contents: write

concurrency:
  group: prepare-transparent-logo
  cancel-in-progress: true

jobs:
  make-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DevelopSupabase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Create transparent PNG
        run: python .github/scripts/make_logo_transparent.py

      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/office-impact-logo.png
          git commit -m "Add transparent legacy Office Impact logo"
          git push
